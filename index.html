<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetSync</title>

    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#000000">

    <style>
        body {
            font-family: Arial;
            background: #111;
            color: white;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            height: 90px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            background: #1f1f1f;
            color: white;
        }
    </style>
</head>

<body>

    <h1>VetSync</h1>

    <div class="grid">

        <button onclick="window.location.href='./boi.html'">
            BOI
        </button>

        <button onclick="window.location.href='./dg.html'">
            DG
        </button>

        <button onclick="window.location.href='./iatf.html'">
            IATF
        </button>

        <button onclick="window.location.href='./lotes.html'">
            LOTES
        </button>

        <button onclick="window.location.href='./fazendas.html'">
            FAZENDAS
        </button>

    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./service-worker.js')
        }
    </script>

</body>

</html>
