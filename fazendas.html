<body>

    <header>

        <h1>🌾 Fazendas</h1>

    </header>

    <nav>

        <a href="/">Dashboard</a>

        <a href="./fazendas.html">
            Fazendas
        </a>

        <a href="./boi.html">
            Boi/Sêmen
        </a>

    </nav>

    <div class="container">

        <div class="box">

            <h2>Cadastrar Fazenda</h2>

            <input type="text" id="nomeFazenda" placeholder="Nome da fazenda">

            <button onclick="salvarFazenda()">
                Salvar Fazenda
            </button>

        </div>

        <div class="box">

            <h2>Cadastrar Lote</h2>

            <input type="text" id="nomeLote" placeholder="Nome do lote">

            <input type="number" id="quantidadeLote" placeholder="Quantidade de animais">

            <select id="fazendaLote">
            </select>

            <button onclick="salvarLote()">
                Salvar Lote
            </button>

        </div>

        <div class="fazendas" id="listaFazendas">
        </div>

    <script>

        function salvarFazenda() {

            let fazendas =
                JSON.parse(
                    localStorage.getItem('fazendas')
                ) || [];

            const nome =
                document.getElementById(
                    'nomeFazenda'
                ).value;

            if (!nome) {

                alert('Digite o nome da fazenda');
                return;

            }

            const fazenda = {

                nome: nome,
                lotes: []

            };

            fazendas.push(fazenda);

            localStorage.setItem(
                'fazendas',
                JSON.stringify(fazendas)
            );

            document.getElementById(
                'nomeFazenda'
            ).value = '';

            carregarSelectFazendas();
            mostrarFazendas();

        }

        function salvarLote() {

            let fazendas =
                JSON.parse(
                    localStorage.getItem('fazendas')
                ) || [];

            const nomeLote =
                document.getElementById(
                    'nomeLote'
                ).value;

            const quantidade =
                parseInt(
                    document.getElementById(
                        'quantidadeLote'
                    ).value
                ) || 0;

            const indice =
                document.getElementById(
                    'fazendaLote'
                ).value;

            if (!nomeLote) {

                alert('Digite o nome do lote');
                return;

            }

            const lote = {

                nome: nomeLote,
                quantidade: quantidade,
                inseminadas: 0,
                prenhas: 0,
                vazias: 0,
                aguardando: 0

            };

            fazendas[indice]
                .lotes
                .push(lote);

            localStorage.setItem(
                'fazendas',
                JSON.stringify(fazendas)
            );

            document.getElementById(
                'nomeLote'
            ).value = '';

            document.getElementById(
                'quantidadeLote'
            ).value = '';

            atualizarDashboard();
            mostrarFazendas();

        }

        function salvarDG(
            indiceFazenda,
            indiceLote
        ) {

            let fazendas =
                JSON.parse(
                    localStorage.getItem('fazendas')
                ) || [];

            const inseminadas =
                parseInt(
                    document.getElementById(
                        `inseminadas-${indiceFazenda}-${indiceLote}`
                    ).value
                ) || 0;

            const prenhas =
                parseInt(
                    document.getElementById(
                        `prenhas-${indiceFazenda}-${indiceLote}`
                    ).value
                ) || 0;

            const vazias =
                parseInt(
                    document.getElementById(
                        `vazias-${indiceFazenda}-${indiceLote}`
                    ).value
                ) || 0;
            const touro =
                document.getElementById(
                    `touro-${indiceFazenda}-${indiceLote}`
                ).value;
            const aguardando =
                inseminadas - (prenhas + vazias);

            fazendas[indiceFazenda]
                .lotes[indiceLote]
                .inseminadas = inseminadas;

            fazendas[indiceFazenda]
                .lotes[indiceLote]
                .prenhas = prenhas;

            fazendas[indiceFazenda]
                .lotes[indiceLote]
                .vazias = vazias;

            fazendas[indiceFazenda]
                .lotes[indiceLote]
                .aguardando = aguardando;
            fazendas[indiceFazenda]
                .lotes[indiceLote]
                .touro = touro;
            localStorage.setItem(
                'fazendas',
                JSON.stringify(fazendas)
            );

            atualizarDashboard();
            mostrarFazendas();

        }

        function excluirFazenda(indice) {

            if (!confirm('Deseja excluir esta fazenda?')) {
                return;
            }

            let fazendas =
                JSON.parse(
                    localStorage.getItem('fazendas')
                ) || [];

            fazendas.splice(indice, 1);

            localStorage.setItem(
                'fazendas',
                JSON.stringify(fazendas)
            );

            atualizarDashboard();
            carregarSelectFazendas();
            mostrarFazendas();

        }

        function excluirLote(
            indiceFazenda,
            indiceLote
        ) {

            if (!confirm('Excluir lote?')) {
                return;
            }

            let fazendas =
                JSON.parse(
                    localStorage.getItem('fazendas')
                ) || [];

            fazendas[indiceFazenda]
                .lotes
                .splice(indiceLote, 1);

            localStorage.setItem(
                'fazendas',
                JSON.stringify(fazendas)
            );

            atualizarDashboard();
            mostrarFazendas();

        }

        function atualizarDashboard() {

            const fazendas =
                JSON.parse(
                    localStorage.getItem('fazendas')
                ) || [];

            let lotes = [];

            fazendas.forEach(function (fazenda) {

                lotes =
                    lotes.concat(
                        fazenda.lotes
                    );

            });

            localStorage.setItem(
                'lotes',
                JSON.stringify(lotes)
            );

        }
        function carregarTouros() {

            const touros =
                JSON.parse(
                    localStorage.getItem('touros')
                ) || [];

            const selects =
                document.querySelectorAll(
                    'select[id^=\"touro-\"]'
                );

            selects.forEach(function (select) {

                select.innerHTML = '';

                touros.forEach(function (touro) {

                    const option =
                        document.createElement('option');

                    option.value =
                        touro.nome;

                    option.textContent =
                        touro.nome;

                    select.appendChild(option);

                });

            });

        }
        function carregarSelectFazendas() {

            const select =
                document.getElementById(
                    'fazendaLote'
                );

            select.innerHTML = '';

            const fazendas =
                JSON.parse(
                    localStorage.getItem('fazendas')
                ) || [];

            fazendas.forEach(function (
                fazenda,
                indice
            ) {

                const option =
                    document.createElement('option');

                option.value = indice;

                option.textContent =
                    fazenda.nome;

                select.appendChild(option);

            });

        }

        function mostrarFazendas() {

            const lista =
                document.getElementById(
                    'listaFazendas'
                );

            lista.innerHTML = '';

            const fazendas =
                JSON.parse(
                    localStorage.getItem('fazendas')
                ) || [];

            fazendas.forEach(function (
                fazenda,
                indice
            ) {

                const div =
                    document.createElement('div');

                div.className = 'card';

                let lotesHTML = '';

                fazenda.lotes.forEach(function (
                    lote,
                    indiceLote
                ) {

                    lotesHTML += `

                        <div class="lote">

                            <strong>
                                ${lote.nome}
                            </strong>

                            <br><br>

                            Animais:
                            ${lote.quantidade}

                            <br>

                            Inseminadas:
                            ${lote.inseminadas}

                            <br>

                            Prenhas:
                            ${lote.prenhas}

                            <br>

                            Vazias:
                            ${lote.vazias}

                            <br>

                            Aguardando DG:
                            ${lote.aguardando}

                            <br>
<br>

Touro:
${lote.touro || '-'}
                            Taxa:
                            ${lote.quantidade > 0
                            ? ((lote.prenhas / lote.quantidade) * 100)
                                .toFixed(1)
                            : 0
                        }%

                            <br><br>

                            <input
                                type="number"
                                id="inseminadas-${indice}-${indiceLote}"
                                placeholder="Inseminadas"
                            >

                            <input
                                type="number"
                                id="prenhas-${indice}-${indiceLote}"
                                placeholder="Prenhas"
                            >

                            <input
                                type="number"
                                id="vazias-${indice}-${indiceLote}"
                                placeholder="Vazias"
                            ><select
    id="touro-${indice}-${indiceLote}"
>

</select>

                            <button
                                onclick="
                                    salvarDG(
                                        ${indice},
                                        ${indiceLote}
                                    )
                                "
                            >

                                Salvar DG

                            </button>

                            <br><br>

                            <button
                                class="btn-excluir"
                                onclick="
                                    excluirLote(
                                        ${indice},
                                        ${indiceLote}
                                    )
                                "
                            >

                                Excluir Lote

                            </button>

                        </div>

                    `;

                });

                div.innerHTML = `

                    <h3>${fazenda.nome}</h3>

                    <button
                        class="btn-excluir"
                        onclick="excluirFazenda(${indice})"
                    >

                        Excluir Fazenda

                    </button>

                    <br><br>

                    ${lotesHTML}

                `;

                lista.appendChild(div);

            });

        }

        carregarSelectFazendas();
        mostrarFazendas();
        setTimeout(function () {

            carregarTouros();

        }, 300);
    </script>

</body>
